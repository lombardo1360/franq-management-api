  name: Debug GitHub OIDC

  on:
    push:
      branches:
        - main

  permissions:
    id-token: write
    contents: read

  jobs:
    debug-oidc:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: GitHub context
          run: |
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Actor: $GITHUB_ACTOR"

        - name: Get OIDC token
          uses: actions/github-script@v7
          with:
            script: |
              const token = await core.getIDToken('sts.amazonaws.com');
              
              const parts = token.split('.');
              
              const payload = JSON.parse(
                Buffer.from(parts[1], 'base64url').toString()
              );
              
              console.log('OIDC issuer:', payload.iss);
              console.log('OIDC audience:', payload.aud);
              console.log('OIDC subject:', payload.sub);
              console.log('OIDC repository:', payload.repository);
              console.log('OIDC ref:', payload.ref);
    
